<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Pragas</title>
</head>
<body>
    <div class="container" style="text-align: center">
        <div class="jumbotron custom-jumbotron" style="background-color: #ffffff; color: rgb(10, 145, 71);">
            <h1>Trabalho 01 da disciplina I.A II</h1>
            <h5>sobre Teachable Machine Image Model</h5>
        </div>
        <div><h2>Carregue uma imagem da folha de café para análise</h2></div>
        
        
        <button type="button" class="btn btn-primary" onclick="init()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-camera" viewBox="0 0 16 16">
                <path d="M15 12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h1.172a3 3 0 0 0 2.12-.879l.83-.828A1 1 0 0 1 6.827 3h2.344a1 1 0 0 1 .707.293l.828.828A3 3 0 0 0 12.828 5H14a1 1 0 0 1 1 1zM2 4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-1.172a2 2 0 0 1-1.414-.586l-.828-.828A2 2 0 0 0 9.172 2H6.828a2 2 0 0 0-1.414.586l-.828.828A2 2 0 0 1 3.172 4z"/>
                <path d="M8 11a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5m0 1a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M3 6.5a.5.5 0 1 1-1 0 .5.5 0 0 1 1 0"/>
            </svg>
            Iniciar webcam
        </button>
        

        <label for="imageUpload" class="btn btn-secondary">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-upload" viewBox="0 0 16 16">
                <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5"/>
                <path d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V11.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708z"/>
            </svg>
            Escolher Arquivo
        </label>
        <input type="file" id="imageUpload" class="d-none" accept="image/*" onchange="analyzeImage()">
        
        
        <div id="webcam-container"></div>
        
        <div id="image-container"></div>

<table class="table table-bordered table-striped" id="predictions-table" style="border-radius: 10px; overflow: hidden;">
    <thead>
        <h3>Resultados da Análise</h3>
        <tr>
            <th scope="col">Classe</th>
            <th scope="col">Probabilidade (%)</th>
        </tr>
    </thead>
    <tbody id="label-container">
    </tbody>
</table>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script src="script.js"></script>

    <footer class="custom-footer" style="background-color: rgb(10, 145, 71); color: white; text-align: center; padding: 20px; margin-top: 20px;">
    <p>&copy; 2025 ATHOS B. TELINI - Todos os direitos reservados</p>
</footer>
</body>
</html>
