<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Pragas</title>
</head>
<body>
    <div class="container" style="text-align: center">
        <div class="jumbotron" style="background-color: #312f9e; color: white">
            <h1>IFSULDEMINAS - Teachable Machine Image Model</h1>
            <p>Campus Machado</p>
        </div>
        <div>Pragas de café</div>
        
        <!-- Botão para iniciar a câmera -->
        <button type="button" class="btn btn-primary" onclick="init()">Iniciar Câmera</button>

        <!-- Input para selecionar imagem -->
        <input type="file" id="imageUpload" class="btn btn-secondary" accept="image/*" onchange="analyzeImage()">
        
        <!-- Área para exibição da webcam -->
        <div id="webcam-container"></div>
        
        <!-- Área para exibição da imagem carregada -->
        <div id="image-container"></div>

        <!-- Área para exibir os resultados da predição -->
        <div id="label-container"></div>
    </div>
    
    <!-- Bibliotecas externas necessárias para o funcionamento -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script src="script.js"></script>

    <footer style="background-color: #312f9e; color: white; text-align: center; padding: 20px; margin-top: 20px;">
        <p>&copy; 2025 ATHOS B. TELINI - Todos os direitos reservados</p>
    </footer>
</body>
</html>
