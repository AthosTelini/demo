<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pragas</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

    <!-- Estilo personalizado -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container text-center">
        <div class="jumbotron" style="background-color: #2f9e41; color: white">
            <h1>IFSULDEMINAS - Teachable Machine Image Model</h1>
            <p>Campus Machado</p>
        </div>
        <h2>Pragas de Café</h2>

        <!-- Botões -->
        <button type="button" class="btn btn-primary" onclick="init()">Start</button>
        <button type="button" class="btn btn-secondary" onclick="switchCamera()">Trocar Câmera</button>

        <!-- Área de exibição -->
        <div id="webcam-container"></div>
        <div id="label-container"></div>
    </div>

    <!-- TensorFlow e Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <!-- Código JavaScript -->
    <script src="./script.js"></script>

    <!-- Rodapé -->
    <footer class="text-center text-white" style="background-color: #2f9e41; padding: 20px; margin-top: 20px;">
        <p>&copy; 2025 ATHOS B. TELINI - Todos os direitos reservados</p>
    </footer>
</body>
</html>
